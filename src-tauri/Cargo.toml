[package]
name = "xuanji-lu"
version = "0.1.17"
description = "《璇玑录》——《星骰工作室》本地版"
authors = ["Lyra Studio", "Lyrazhou"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "xuanji_lu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "xuanji-lu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.39", features = ["serde"] }
dirs = "6.0.0"
edge-tts-rust = "0.1.3"
getrandom = "0.3.4"
keyring = { version = "3.6.1", features = ["windows-native"] }
md5 = "0.7.0"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
tauri = { version = "2.3.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.2.1"
tauri-plugin-opener = "2.2.5"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["time"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
